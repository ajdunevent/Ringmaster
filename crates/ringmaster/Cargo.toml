[package]
name = "ringmaster"
description = "RingConn smart ring companion for mobile Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
default-run = "ringmaster"

[dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_5"] }
anyhow = "1.0.104"
ashpd = { version = "0.13", default-features = false, features = ["async-io", "background"] }
async-channel = "2.5.0"
bluer = { version = "0.17.4", features = ["bluetoothd"] }
chrono = "0.4.45"
futures = "0.3.34"
gio = "0.22"
glib = "0.22"
gtk = { version = "0.11", package = "gtk4", features = ["v4_12"] }
colmi = { path = "../colmi" }
ringconn = { path = "../ringconn" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
